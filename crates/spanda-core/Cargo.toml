[package]
name = "spanda-core"
version = "0.3.0"
edition = "2021"
authors = ["Bhupen Nayak <bhupennayak@icloud.com>", "Spanda Research"]
description = "High-throughput, sub-microsecond epistemic uncertainty engine & LLM guardrail gateway"
license = "BSL-1.1"
homepage = "https://github.com/Adarshent/Spnda"
repository = "https://github.com/Adarshent/Spnda.git"

[lib]
name = "spanda_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spnda"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
