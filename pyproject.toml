[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spanda"
version = "0.1.0"
authors = [
  { name="Bhupen Nayak", email="bhupennayak@icloud.com" },
]
description = "Zero-cost epistemic uncertainty estimation for LLMs (90,000x faster than Semantic Entropy)"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/Adarshent/Spnda"
"Bug Tracker" = "https://github.com/Adarshent/Spnda/issues"
